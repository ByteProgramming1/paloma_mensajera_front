<app-navbar />
<section class="cart-page">
  <app-section-header
    title="Tu Carrito"
    subtitle="Puedes enviar varios productos en un solo pedido."
  />

  <div class="cart-layout">
    <div class="cart-items">
      @for (item of cart.cartItems(); track item.product.id) {
        <app-cart-item
          [item]="item"
          (increment)="cart.increment($event)"
          (decrement)="cart.decrement($event)"
          (remove)="cart.remove($event)"
        />
      } @empty {
        <p class="cart-empty">Tu carrito está vacío.</p>
      }
    </div>

    <app-cart-summary
      [subtotal]="cart.subtotal()"
      [totalItems]="cart.totalItems()"
      (checkout)="onCheckout()"
    />
  </div>
</section>
