<article class="product-card" [class.product-card--soldout]="!product().isActive">
  <div class="product-image-wrap">
    <img class="product-image" [src]="product().imageUrl" [alt]="product().name" />
    <span
      class="status-badge"
      [class.status-badge--available]="product().isActive"
      [class.status-badge--soldout]="!product().isActive"
    >
      {{ product().isActive ? 'Disponible' : 'Agotado' }}
    </span>
  </div>

  <div class="product-body">
    <span class="product-category">{{ product().type }}</span>
    <h3 class="product-title">{{ product().name }}</h3>
    <p class="product-description">{{ product().description }}</p>

    <div class="product-meta">
      <span class="product-price">${{ formatPrice(product().price) }}</span>
      <span class="product-stock">{{ product().stock }} disponibles</span>
    </div>

    <button
      type="button"
      class="add-to-cart-button"
      [disabled]="!product().isActive"
      (click)="onAddToCart()"
    >
      @if (product().isActive) {
        <svg class="cart-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M3 3H5L5.4 5M5.4 5H21L18 14H7L5.4 5Z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="9" cy="19" r="1.3" fill="currentColor" />
          <circle cx="17" cy="19" r="1.3" fill="currentColor" />
        </svg>
        Agregar al carrito
      } @else {
        Producto Agotado
      }
    </button>
  </div>
</article>
